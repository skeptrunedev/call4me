  <text x="80" y="235" font-family="Times New Roman, Times, serif" font-size="74" fill="#000000">Vapi alternatives</text>
  <text x="80" y="310" font-family="Times New Roman, Times, serif" font-size="40" fill="#333333">phone calls inside the work your agent already does</text>
