<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>AI agents that make phone calls for you (2026)</title>
  <desc>Consumer AI agents that call businesses for you, compared by what they call for, access, price and live control.</desc>
  <rect width="1200" height="630" fill="#f6f6f2"/>
  <text x="80" y="115" font-family="Arial, Helvetica, sans-serif" fill="#866000" font-size="30">call4me comparison · october 12, 2026</text>
  <text x="80" y="215" font-family="Arial, Helvetica, sans-serif" fill="#151515" font-weight="700" font-size="64">AI agents that call for you</text>
  <text x="80" y="280" font-family="Arial, Helvetica, sans-serif" fill="#64645f" font-size="38">nine products. sourced facts. unknowns marked.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="24">
    <rect x="80" y="340" width="320" height="160" rx="8" fill="#ffffff" stroke="#866000"/>
    <rect x="440" y="340" width="320" height="160" rx="8" fill="#ffffff" stroke="#ffb000"/>
    <rect x="800" y="340" width="320" height="160" rx="8" fill="#ffffff" stroke="#a7a79e"/>
    <text x="110" y="393" fill="#866000">01 · what it calls for</text>
    <text x="110" y="447" fill="#64645f" font-size="21">quotes, bookings, bills</text>
    <text x="470" y="393" fill="#ffb000">02 · who can use it</text>
    <text x="470" y="447" fill="#64645f" font-size="21">open, phone only, or test</text>
    <text x="830" y="393" fill="#64645f" font-size="22">03 · can you join</text>
    <text x="830" y="447" fill="#64645f" font-size="21">summary or live control</text>
  </g>
  <text x="80" y="565" font-family="Arial, Helvetica, sans-serif" fill="#64645f" font-size="27">google, gemini, muse, instinct, pine, mitra, voyp, genspark, call4me.</text>
</svg>
