<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Make phone calls from T3 Code</title>
  <desc id="desc">Configure the provider behind the T3 thread, then use Call4me for calls and results.</desc>
  <rect width="1200" height="630" fill="#ffffff"/>
  <text x="80" y="130" font-family="Times New Roman, Times, serif" font-size="38" fill="#551a8b">call4me field test · oct 4, 2026</text>
  <text x="80" y="230" font-family="Times New Roman, Times, serif" font-size="72">Give your T3 thread a phone</text>
  <text x="80" y="300" font-family="Times New Roman, Times, serif" font-size="37" fill="#333333">Provider configuration, actual tools, useful results</text>
  <g fill="none" stroke="#0000ee" stroke-width="4">
    <rect x="80" y="385" width="280" height="110"/>
    <path d="M360 440h65m-15-15 15 15-15 15"/>
    <rect x="435" y="385" width="300" height="110"/>
    <path d="M735 440h65m-15-15 15 15-15 15"/>
    <rect x="810" y="385" width="310" height="110"/>
  </g>
  <g font-family="Times New Roman, Times, serif" text-anchor="middle">
    <text x="220" y="435" font-size="34">T3 Code thread</text>
    <text x="220" y="475" font-size="27">your existing task</text>
    <text x="585" y="435" font-size="34">Codex or Claude</text>
    <text x="585" y="475" font-size="27">selected provider</text>
    <text x="965" y="435" font-size="34">call4me MCP</text>
    <text x="965" y="475" font-size="27">calls and evidence</text>
  </g>
  <text x="80" y="570" font-family="Times New Roman, Times, serif" font-size="30" fill="#551a8b">Configure the agent on the machine running the thread</text>
</svg>
