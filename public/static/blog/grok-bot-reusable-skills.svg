<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Turn a Grok Bot task into a reusable skill</title>
  <desc id="desc">Keep the method and verify it again with new task inputs.</desc>
  <rect width="1200" height="630" fill="#fff"/>
  <text x="80" y="112" font-family="Times New Roman, Times, serif" font-size="35" fill="#551a8b">call4me guides · oct 5, 2026</text>
  <text x="80" y="212" font-family="Times New Roman, Times, serif" font-size="75" fill="#111">Save the method as a skill.</text>
  <text x="80" y="280" font-family="Times New Roman, Times, serif" font-size="40" fill="#444">New task, new facts, same careful process.</text>
  <g font-family="Times New Roman, Times, serif" font-size="33" fill="#0000ee">
    <rect x="80" y="368" width="260" height="112" rx="8" fill="#f5f3ff"/>
    <rect x="470" y="368" width="260" height="112" rx="8" fill="#f5f3ff"/>
    <rect x="860" y="368" width="260" height="112" rx="8" fill="#f5f3ff"/>
    <text x="120" y="433">review result</text>
    <text x="507" y="433">save method</text>
    <text x="899" y="433">test new task</text>
    <text x="391" y="435" font-size="54">→</text>
    <text x="781" y="435" font-size="54">→</text>
  </g>
  <text x="80" y="581" font-family="Times New Roman, Times, serif" font-size="29" fill="#555">Keep evidence checks and approval boundaries.</text>
</svg>
