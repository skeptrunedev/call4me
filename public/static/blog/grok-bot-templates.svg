  <rect width="1200" height="630" fill="#fff"/>
  <text x="80" y="112" font-family="Times New Roman, Times, serif" font-size="35" fill="#551a8b">call4me guides · oct 5, 2026</text>
  <text x="80" y="212" font-family="Times New Roman, Times, serif" font-size="68" fill="#111">5 Grok Bot calling templates</text>
  <text x="80" y="277" font-family="Times New Roman, Times, serif" font-size="39" fill="#444">Give your agent a phone and a clear brief.</text>
  <g font-family="Times New Roman, Times, serif" font-size="31">
    <rect x="80" y="340" width="1040" height="185" rx="8" fill="#f5f3ff"/>
    <text x="112" y="393" fill="#0000ee">appointments</text>
