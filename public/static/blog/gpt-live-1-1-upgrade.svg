<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title description">
  <title id="title">How we upgraded call4me to GPT-Live-1.1</title>
  <desc id="description">call4me moved every phone call from gpt-live-1 to gpt-live-1.1 with a one-line configuration change, after checking voices, session length and a phone menu evaluation.</desc>
  <rect width="1200" height="630" fill="#f6f6f2"/>
  <text x="80" y="110" font-family="Arial, Helvetica, sans-serif" fill="#866000" font-size="40">call4me engineering · nov 19, 2026</text>
  <text x="80" y="210" font-family="Arial, Helvetica, sans-serif" fill="#151515" font-weight="700" font-size="76">Upgrading to GPT-Live-1.1</text>
  <text x="80" y="280" font-family="Arial, Helvetica, sans-serif" fill="#64645f" font-size="40">One line of config, then proving calls didn't get worse</text>
  <g font-family="Menlo, Consolas, monospace" font-size="40">
    <text x="80" y="390" fill="#a33">- "VOICE_MODEL": "gpt-live-1"</text>
    <text x="80" y="450" fill="#2a6b2a">+ "VOICE_MODEL": "gpt-live-1.1"</text>
  </g>
  <text x="80" y="540" font-family="Arial, Helvetica, sans-serif" fill="#866000" font-size="28">6 VOICES · 2 HOUR SESSIONS · PHONE MENU EVAL · ZERO-CALL DEPLOY</text>
</svg>
