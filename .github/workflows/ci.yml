name: CI

on:
  push:
    branches: [main]
  pull_request:

# Pull requests cancel their older runs. Pushes to main each get their own run; the deploy jobs
# below queue per Worker instead, so a voice deploy waiting on calls never holds up the site.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Recommendations run on the bundled CPU runtime; CI needs no CUDA libraries.
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf-typegen
      - run: npm run build:site
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run openapi:generate && git diff --exit-code -- openapi.json
      - run: npx wrangler deploy --dry-run
      - run: npx wrangler deploy -c wrangler.voice.jsonc --dry-run

  migrate:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: migrate
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf-typegen
      - name: Apply D1 migrations
        run: npm run db:migrate:remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Deploying the site never touches a live call, so it goes out right away, unless this commit
  # changes the session interface the voice Worker serves; then it waits for that to roll out.
  deploy-site:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: deploy-site
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf-typegen
      - name: Configure Reddit Conversions API secret
        run: printf '%s' "$REDDIT_CAPI_TOKEN" | npx wrangler secret put REDDIT_CAPI_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          REDDIT_CAPI_TOKEN: ${{ secrets.REDDIT_CAPI_TOKEN }}
      - name: Configure Meta Conversions API secret
        run: printf '%s' "$META_CAPI_TOKEN" | npx wrangler secret put META_CAPI_TOKEN
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          META_CAPI_TOKEN: ${{ secrets.META_CAPI_TOKEN }}
      - name: Deploy the site
        run: scripts/deploy-site.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Deploying the voice Worker drops live calls, so it waits for none to be up (calls run 30 minutes at most).
  deploy-voice:
    needs: migrate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production
    concurrency:
      group: deploy-voice
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run cf-typegen
      - name: Deploy the voice worker once no call is up
        run: scripts/deploy-voice.sh
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # The metrics dashboard (dashboard/, dash.call4.me behind Cloudflare Access) only reads D1, so it
  # verifies and deploys on its own, without waiting on migrations or live calls.
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-dashboard
      cancel-in-progress: false
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npx vite build
      - name: Deploy the dashboard
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
