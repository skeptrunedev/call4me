<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Grok Bot and Meta Muse for phone calls</title>
  <desc>Tested Grok and Muse calling setups, with results from different restaurant and library inquiries.</desc>
  <rect width="1200" height="630" fill="#f6f6f2"/>
  <text x="80" y="115" font-family="Arial, Helvetica, sans-serif" fill="#866000" font-size="30">call4me phone workflow comparison · october 5, 2026</text>
  <text x="80" y="215" font-family="Arial, Helvetica, sans-serif" fill="#151515" font-weight="700" font-size="72">Grok Bot vs Meta Muse</text>
  <text x="80" y="280" font-family="Arial, Helvetica, sans-serif" fill="#64645f" font-size="38">tested connections. recorded results.</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="24">
    <rect x="80" y="340" width="320" height="160" rx="8" fill="#ffffff" stroke="#866000"/>
    <rect x="440" y="340" width="320" height="160" rx="8" fill="#ffffff" stroke="#ffb000"/>
    <rect x="800" y="340" width="320" height="160" rx="8" fill="#ffffff" stroke="#a7a79e"/>
    <text x="110" y="393" fill="#866000">01 · connect the phone</text>
    <text x="110" y="447" fill="#64645f" font-size="21">setup and account access</text>
    <text x="470" y="393" fill="#ffb000">02 · one approved call</text>
    <text x="470" y="447" fill="#64645f" font-size="21">different real inquiries</text>
    <text x="830" y="393" fill="#64645f" font-size="22">03 · check the result</text>
    <text x="830" y="447" fill="#64645f" font-size="21">facts and open questions</text>
  </g>
  <text x="80" y="565" font-family="Arial, Helvetica, sans-serif" fill="#64645f" font-size="27">restaurant menu and library staff answers.</text>
</svg>
